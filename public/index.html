<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Donaciones</title>
    <!-- Tailwind CSS para un diseño moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Stripe JS -->
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Apoya Nuestra Causa</h1>
        <p class="text-sm text-gray-500 text-center mb-6">Tu contribución hace la diferencia.</p>
        
        <form id="donation-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nombre</label>
                <input type="text" id="donor-name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="Tu nombre">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Monto (USD)</label>
                <input type="number" id="donation-amount" min="1" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="10">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 px-4 rounded-md hover:bg-indigo-700 transition font-medium shadow-md">
                Donar con Stripe
            </button>
        </form>
    </div>

    <script>
        document.getElementById('donation-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('donor-name').value;
            const amount = document.getElementById('donation-amount').value;
            alert(`¡Gracias por tu apoyo, ${name}! Tu donación de $${amount} USD está siendo procesada.`);
        });
    </script>
</body>
</html>

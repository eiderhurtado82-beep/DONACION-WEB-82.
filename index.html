<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Donaciones</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <span class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Donaciones Online</span>
            <h1 class="text-2xl font-black text-gray-800 mt-2">Apoya Nuestra Causa</h1>
            <p class="text-sm text-gray-500 mt-1">Tu granito de arena hace la diferencia hoy.</p>
        </div>
        
        <form id="donation-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Nombre del Donante</label>
                <input type="text" id="donor-name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition" placeholder="Ej. Juan Pérez">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Monto a Donar (USD)</label>
                <input type="number" id="donation-amount" min="1" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition" placeholder="10">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-200">
                Donar Ahora con Stripe
            </button>
        </form>
    </div>

    <script>
        document.getElementById('donation-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('donor-name').value;
            const amount = document.getElementById('donation-amount'].value;
            alert(`¡Muchas gracias, ${name}! Tu donación de $${amount} USD está lista para procesarse.`);
        });
    </script>
</body>
</html>
